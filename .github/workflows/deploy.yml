name: Deploy

# Promotion flow:  dev  ->  staging  ->  main (production)
# Each branch deploys to its own environment. The `production` GitHub
# Environment should have a required reviewer (you) so prod deploys pause
# for manual approval.
#
# Inert until these repo secrets exist:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (or swap the deploy step for your container registry / host).

on:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secrets present?
        id: guard
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — hosting secrets not configured yet."
          fi

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: npm

      - name: Deploy to Vercel
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          vercel build $([ "$TARGET" = "production" ] && echo "--prod") --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt $([ "$TARGET" = "production" ] && echo "--prod") --token="$VERCEL_TOKEN"
