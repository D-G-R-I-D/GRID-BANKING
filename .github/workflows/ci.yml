name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma generate (postinstall) reads this; it doesn't connect at install time.
  DATABASE_URL: postgresql://grid:grid@localhost:5432/grid

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: format check (temporarily shows the diff on failure)
        run: npm run format:check || (npx prettier --write . && git --no-pager diff)

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SESSION_SECRET: build-time-placeholder-value-at-least-32-chars-long

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: grid
          POSTGRES_DB: grid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grid"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://grid:grid@localhost:5432/grid
      SESSION_SECRET: e2e-session-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx prisma db push --skip-generate
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The single check to mark "required" in branch protection.
  ci-ok:
    if: always()
    needs: [quality, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "quality=${{ needs.quality.result }} build=${{ needs.build.result }} e2e=${{ needs.e2e.result }}"
          [ "${{ needs.quality.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ] \
            && [ "${{ needs.e2e.result }}" = "success" ] \
            || { echo "::error::a required CI job failed"; exit 1; }
