name: Security

on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Reports every advisory but doesn't block: the current highs are in
      # dev-only tooling (prisma CLI -> deepmerge-ts) with no production impact.
      # Dependabot bumps them when upstream patches. Tighten to blocking once
      # the tree is clean.
      - run: npm audit --audit-level=high
        continue-on-error: true
