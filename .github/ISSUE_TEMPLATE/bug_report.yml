name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected vs. what actually happened. Do NOT paste real personal or financial data.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: browser, OS, branch/commit, dev/staging/prod
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Could this be security-sensitive?
      description: If yes, consider reporting privately per SECURITY.md instead.
      options:
        - "No"
        - "Maybe / not sure"
        - "Yes"
    validations:
      required: true
